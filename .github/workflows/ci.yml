name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-explorer-offline
          path: dist-offline/quantum-explorer-offline.html
          if-no-files-found: error
